name: build
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get update
      - run: sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi cmake build-essential
      - uses: actions/checkout@v4
      - run: git clone --depth 1 -b 2.3.1 https://github.com/raspberrypi/pico-sdk
      - run: cd pico-sdk && git submodule update --init --depth 1 lib/tinyusb
      # picotool (needed for the .uf2) is fetched and built by the SDK if missing
      - run: cmake -DPICO_SDK_PATH=$PWD/pico-sdk -DPICO_BOARD=pico .
      - run: make
      - uses: actions/upload-artifact@v4
        with:
          name: pico_serprog
          path: |
            readme.md
            COPYING
            pico_serprog.elf
            pico_serprog.uf2
